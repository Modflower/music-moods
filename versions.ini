minecraft = com.mojang:minecraft:$minecraft
mixinextras-common = io.github.llamalad7:mixinextras-common:mixinextras
mixinsquared-common = com.github.bawnorton.mixinsquared:mixinsquared-common:mixinsquared

; Fabric
fabric-loader = net.fabricmc:fabric-loader:fabric-loader
mixinsquared-fabric = com.github.bawnorton.mixinsquared:mixinsquared-fabric:mixinsquared

; Forge
forge = net.minecraftforge:forge:$forge
mixinextras-forge = io.github.llamalad7:mixinextras-forge:mixinextras
mixinsquared-forge = com.github.bawnorton.mixinsquared:mixinsquared-forge:mixinsquared

; Neoforged
neoforge = net.neoforged:neoforge:$neoforge
mixinsquared-neoforge = com.github.bawnorton.mixinsquared:mixinsquared-neoforge:mixinsquared

; Manifold
manifold = systems.manifold:manifold:manifold
manifold-rt = systems.manifold:manifold-rt:manifold

manifold-ext = systems.manifold:manifold-ext:manifold
manifold-ext-rt = systems.manifold:manifold-ext-rt:manifold

manifold-props = systems.manifold:manifold-props:manifold
manifold-props-rt = systems.manifold:manifold-props-rt:manifold

manifold-unchecked = systems.manifold:manifold-exceptions:manifold

manifold-preprocessor = systems.manifold:manifold-preprocessor:manifold

; Manifold extensions... witch edition,
asm = org.ow2.asm:asm:asm
asm-tree = org.ow2.asm:asm-tree:asm

; Flexver
flexver = com.unascribed:flexver-java:1.1.1

; Mods
spruceui = dev.lambdaurora:spruceui:$spruceui
githubSpruceui = com.github.LambdAurora:SpruceUI:$githubSpruceui
modmenu = com.terraformersmc:modmenu:$modmenu
fabric-api = net.fabricmc.fabric-api:fabric-api:$fabricApi

; Required for SpruceUI >=1.21.9
yumi-mc-foundation = dev.yumi.mc.core:yumi-mc-foundation:$yumi-mc-foundation

; Required for Forge
obsidianui = maven.modrinth:obsidianui:$obsidianui

; Witch
annotations = org.jetbrains:annotations:26.0.2-1

[versions]
fabric-loader = 0.17.+

manifold = 2025.1.27

asm = 9.9

mixinextras = 0.5.0
mixinsquared = 0.3.7-beta.1

; Plugins
fabric-loom = 1.13.+
architectury-loom = 1.13.+
licenser = 2.1.+
minotaur = 2.+

[repositories]
mavenCentral =
Nexus Repository OSS = https://oss.sonatype.org/content/repositories/snapshots
Modrinth[exclusive:true,group:"maven.modrinth"] = https://api.modrinth.com/maven
Gegy = https://maven.gegy.dev
TerraformersMC = https://maven.terraformersmc.com/releases
Brawnorton = https://maven.bawnorton.com/releases

[dependencies]
compileOnly = manifold-rt,manifold-ext-rt,manifold-props-rt

annotationProcessor = manifold,manifold-preprocessor,manifold-ext,manifold-props
testAnnotationProcessor = manifold,manifold-preprocessor,manifold-ext,manifold-props

[fabric]
minecraft = minecraft

annotationProcessor = mixinsquared-fabric
implementation = mixinsquared-fabric

modImplementation = fabric-loader,spruceui,githubSpruceui,modmenu,fabric-api
include = spruceui,githubSpruceui,yumi-mc-foundation,mixinsquared-fabric

[fabric.repositories]
AperLambda = https://aperlambda.github.io/maven
JitPack[priority:-32768] = https://www.jitpack.io

; Note: only for legacy versions NeoForge does not support.
[forge]
minecraft = minecraft
forge = forge

compileOnly = mixinextras-common,mixinsquared-common
annotationProcessor = manifold-unchecked,mixinextras-common,mixinsquared-common

modImplementation = obsidianui
implementation = mixinextras-forge,mixinsquared-forge
include = obsidianui,mixinextras-forge,mixinsquared-forge

; I'm not entertaining Forge's broken logic.
; It shall get code and be happy with it.
testAnnotationProcessor = manifold-unchecked

[forge.repositories]
Forge = https://files.minecraftforge.net/

[old-forge]
minecraft = minecraft
forge = forge

implementation = mixinextras-common,mixinsquared-common
annotationProcessor = manifold-unchecked,mixinextras-common,mixinsquared-common
shadow = mixinextras-common,mixinsquared-common

modImplementation = obsidianui

[old-forge.repositories]
Forge = https://files.minecraftforge.net/

[neoforge]
;implementation = neoforge
minecraft = minecraft
neoForge = neoforge

compileOnly = mixinsquared-common
annotationProcessor = mixinsquared-common
implementation = mixinsquared-neoforge
include = mixinsquared-neoforge

; TODO: implement basic classifier & attribute support
;modImplementation = spruceui
;include = spruceui,yumi-mc-foundation

[neoforge.repositories]
NeoForged = https://maven.neoforged.net/releases/

[plugins]
; Fabric Loom would be fine here, but Arch Loom can explicitly be told to continue through Loom 1.4+.
; Required as updating to Gradle 9 is currently not feasible. See gradle.properties for more.
loom = dev.architectury.loom:fabric-loom

; Not worth the effort to retool for ForgeGradle.
; Arch Loom works reliably here.
forge = dev.architectury.loom:architectury-loom

; Note: broken 1.21.10 support, will not start reliably.
;  It will build working jars and boot 1.21 reliably tho.
neoforge = dev.architectury.loom:architectury-loom

; Untested - needs extra configuration
;neoforge = net.neoforged.moddev:2.0.115

; Broken - fails to boot dev
;neoforge = net.neoforged.gradle.userdev:7.0.192

licenser = dev.yumi.gradle.licenser:licenser
minotaur = com.modrinth.minotaur:minotaur

shadow = com.gradleup.shadow:9.2.2

machete = io.github.p03w.machete:2.0.1
