[versions]
annotations = "23.0.0"

# https://github.com/LambdAurora/SpruceUI
spruceui = "8.0.0+1.21.6"
modmenu = "15.0.0-beta.3"

# Minecraft
minecraft_version = "1.21.7"
minecraft_required = ">=1.21.7"
fabric_loader = "0.16.+"
fabric_api = "0.129.0+1.21.7"

# Plugins
loom = "1.11.+"
spotless = "5.+"
quiltflower = "1.+"
minotaur = "2.+"

[libraries]
# Minecraft & Quilt
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft_version" }
fabric_loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric_loader" }

# Libraries
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }

# Mods
spruceui = { module = "dev.lambdaurora:spruceui", version.ref = "spruceui" }
modmenu = { module = "com.terraformersmc:modmenu", version.ref = "modmenu" }
fabric_api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric_api" }

[bundles]
compileOnly = ["annotations"]
mod_runtime = []

[plugins]
loom = { id = "fabric-loom", version.ref = "loom" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
minotaur = { id = "com.modrinth.minotaur", version.ref = "minotaur" }
